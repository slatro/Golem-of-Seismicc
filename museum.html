<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seismic Vaults Museum</title>
    <link rel="stylesheet" href="./museum.css" />
  </head>
  <body>
    <main class="museum-shell">
      <section class="canvas-frame">
        <canvas id="game" width="1280" height="720"></canvas>
      </section>

      <div id="interaction-hint" class="hidden">
        <span class="key">E</span> Etkileşime Geç
      </div>

      <!-- Lore Pillar Modal -->
      <div id="lore-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass-panel">
          <div class="modal-header">
            <h2 id="lore-title">Chamber Name</h2>
            <button id="close-modal" class="close-btn">&times;</button>
          </div>
          <div class="modal-body">
            <p id="lore-text" class="lore-text">Lore text goes here...</p>
          </div>
        </div>
      </div>

      <div id="fade-overlay"></div>
    </main>
    <script src="./museum.js"></script>
  </body>
</html>
